<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Aryan Lomte, AI Systems Engineer">
  <title>Aryan Lomte</title>
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="330" y1="0" x2="870" y2="0">
      <stop offset="0%"   stop-color="#6D5BFF" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#6D5BFF" stop-opacity=".9"/>
      <stop offset="52%"  stop-color="#4BC8C0" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#4BC8C0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="x1" values="60;1140" dur="2.6s" begin="2.5s;sweep.end+7s" id="sweep" fill="freeze"/>
      <animate attributeName="x2" values="320;1400" dur="2.6s" begin="2.5s;sweep.end+7s" fill="freeze"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#FBFAF8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FBFAF8" stop-opacity=".82"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#0A0A0F" fill-opacity=".07"/>
    </pattern>
    <style>
      .name  { font-family: Optima, Candara, "Gill Sans", "Trebuchet MS", sans-serif; font-weight: 300; }
      .meta  { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .mono  { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .fade  { opacity: 0; animation: fade 1.1s cubic-bezier(.2,.7,.3,1) forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .5s } .d3 { animation-delay: .85s } .d4 { animation-delay: 1.15s }
      @keyframes fade { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes draw { from { stroke-dashoffset: 1000 } to { stroke-dashoffset: 0 } }
      .ruled { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.6s cubic-bezier(.2,.7,.3,1) .55s forwards; }
    </style>
  </defs>

  <rect width="1200" height="330" fill="#FBFAF8"/>
  <rect width="1200" height="330" fill="url(#grid)"/>

  <g filter="url(#soft)" opacity=".32">
    <ellipse cx="250" cy="90" rx="230" ry="125" fill="#7C6BFF">
      <animate attributeName="cx" values="250;400;250" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;.85;.5" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="930" cy="250" rx="260" ry="130" fill="#2FB6AE">
      <animate attributeName="cx" values="930;790;930" dur="27s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;.4;.7" dur="19s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="620" cy="330" rx="300" ry="90" fill="#9F8BFF">
      <animate attributeName="cy" values="330;290;330" dur="21s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <rect width="1200" height="330" fill="url(#vig)"/>

  <g class="fade d1">
    <text x="600" y="98" class="mono" font-size="12" letter-spacing="7.5" fill="#8A9099" text-anchor="middle">MUMBAI &#183; INDIA &#183; UTC+5:30</text>
  </g>

  <g>
    <text x="600" y="186" class="name fade d2" font-size="76" letter-spacing="17" fill="#15161A" text-anchor="middle">ARYAN LOMTE</text>
    <text x="600" y="186" class="name" font-size="76" letter-spacing="17" fill="url(#sheen)" text-anchor="middle" opacity="0">
      ARYAN LOMTE
      <set attributeName="opacity" to="1" begin="2.5s"/>
    </text>
  </g>

  <line x1="330" y1="218" x2="870" y2="218" stroke="url(#rule)" stroke-width="1.25" class="ruled"/>

  <g class="fade d3">
    <text x="600" y="256" class="meta" font-size="20" letter-spacing="2.2" fill="#474E57" text-anchor="middle">
      I build agentic AI that can prove what it did.
    </text>
  </g>

  <g class="fade d4">
    <text x="600" y="292" class="mono" font-size="11.5" letter-spacing="4.5" fill="#8A9099" text-anchor="middle">
      AI TEAM LEAD @ DEEPCYTES &#183; GENERAL SECRETARY @ ECESA &#183; B.TECH CSBS
    </text>
  </g>
</svg>
