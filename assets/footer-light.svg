<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Open to opportunities">
  <defs>
    <filter id="s2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <linearGradient id="r2" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="820" y2="0">
      <stop offset="0%" stop-color="#4BC8C0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6D5BFF" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#4BC8C0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="v2" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#FBFAF8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FBFAF8" stop-opacity=".95"/>
    </radialGradient>
    <style>
      .m { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      .c { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>
  <rect width="1200" height="150" fill="#FBFAF8"/>
  <g filter="url(#s2)" opacity=".28">
    <ellipse cx="420" cy="150" rx="260" ry="80" fill="#7C6BFF">
      <animate attributeName="cx" values="420;700;420" dur="26s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="820" cy="10" rx="240" ry="70" fill="#2FB6AE">
      <animate attributeName="cx" values="820;560;820" dur="22s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <rect width="1200" height="150" fill="url(#v2)"/>
  <line x1="380" y1="52" x2="820" y2="52" stroke="url(#r2)" stroke-width="1"/>
  <text x="600" y="92" class="m" font-size="21" letter-spacing="1.6" fill="#1C1D22" text-anchor="middle" font-style="italic">Ship fast. Break nothing. Lead well.</text>
  <text x="600" y="122" class="c" font-size="11" letter-spacing="4.5" fill="#8A9099" text-anchor="middle">OPEN TO ROLES, RESEARCH AND COLLABORATION</text>
</svg>
